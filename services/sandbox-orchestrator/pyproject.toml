[project]
name = "tether-sandbox-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.28", "PyYAML>=6.0", "websockets>=13"]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["orchestrator"]
[tool.pytest.ini_options]
pythonpath = ["."]
