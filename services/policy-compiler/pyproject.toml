[project]
name = "tether-policy-compiler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "cryptography>=42"]
[project.scripts]
tether-policy-compile = "policy_compiler.compiler:main"
tether-policy = "policy_compiler.bundle:main"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["policy_compiler"]
[tool.pytest.ini_options]
pythonpath = ["."]
