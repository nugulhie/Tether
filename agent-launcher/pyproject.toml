[project]
name = "tether-launcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "click>=8.1", "websockets>=13"]
[project.scripts]
tether = "tether_launcher.cli:cli"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["tether_launcher"]
[tool.pytest.ini_options]
pythonpath = ["."]
