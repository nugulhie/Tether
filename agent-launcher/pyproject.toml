[project]
name = "company-agent-launcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "click>=8.1", "websockets>=13"]
[project.scripts]
company-agent = "company_agent.cli:cli"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["company_agent"]
[tool.pytest.ini_options]
pythonpath = ["."]
