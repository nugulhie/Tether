# Session token for the Permission MCP. Bound to the Policy API's /v1/ paths only.
# REPLACE policy-api.company.internal with your Policy API host (= PLATFORM_POLICY_API_HOST). Like tether-llm:
# no `tls`/`allowed_ips`, to match the compiler's tether_policy_api rule on the same host:port.
id: tether-policy
display_name: Company Policy API
category: other
credentials:
  - name: session_token
    env_vars: [TETHER_SESSION_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: policy-api.company.internal
    port: 443
    path: /v1/**
    protocol: rest
    enforcement: enforce
    rules:
      - allow: {method: GET, path: "/v1/**"}
      - allow: {method: POST, path: "/v1/**"}
# Real paths only. The Permission MCP runs as a child of the agent (node), which matches as an ancestor;
# /usr/local/bin/python is a symlink in python images and would never match.
binaries: [/usr/local/bin/node]
