# Session token for the company LLM gateway. Bound to the gateway host only: the OpenShell
# proxy substitutes the placeholder nowhere else (403 credential_endpoint_mismatch).
# Not imported: the gateway interceptor vends this file (SnapshotProviderProfiles) as the gateway's only
# profile source (infra/openshell/gateway.toml). Interceptor-vended profiles are read-only, and the
# interceptor denies ImportProviderProfiles/UpdateProviderProfiles. Changing it = changing this file and
# redeploying the interceptor.
# REPLACE llm-gateway.company.internal with your gateway host (= PLATFORM_LLM_GATEWAY_HOST).
# The policy compiler emits its own rule (tether_llm_gateway) for the same host:port. OpenShell rejects a
# policy whose endpoints on one host:port differ in `tls` or `allowed_ips`, so neither this endpoint nor the
# compiler sets them; adding either here requires the identical value in the compiler (a test checks).
id: tether-llm
display_name: Company LLM gateway
category: inference
credentials:
  - name: anthropic_token
    env_vars: [ANTHROPIC_AUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
  - name: openai_token
    env_vars: [TETHER_LLM_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: llm-gateway.company.internal
    port: 443
    path: /**
    protocol: rest
    enforcement: enforce
    access: read-write
# Real paths only (`readlink -f` inside the image): OpenShell matches the connecting process's real
# executable or any ancestor. npm's /usr/local/bin/claude and /usr/local/bin/codex are symlinks to
# JavaScript run by node, so node is what matches. tether-agent: the local-LLM job agent (local-agent/,
# image infra/sandbox-images/local-agent), a real file. Binaries gate network admission only; the
# placeholder itself is endpoint-scoped (docs/threat-model.md).
binaries: [/usr/local/bin/node, /usr/local/bin/tether-agent]
