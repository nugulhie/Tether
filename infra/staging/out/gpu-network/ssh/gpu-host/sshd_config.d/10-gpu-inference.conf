# Generated by infra/gpu/network/generate.py from config.yaml. Do not edit by hand.
# /etc/ssh/sshd_config.d/10-gpu-inference.conf on every GPU inference host (ADR 0001 D2, G-7).
# sshd uses the first value it reads: the "10-" prefix sorts before distribution drop-ins such as
# 50-cloud-init.conf, which may turn password login back on.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
AllowGroups sudo
DisableForwarding yes
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
# VERBOSE logs the key fingerprint of every login.
LogLevel VERBOSE
SyslogFacility AUTHPRIV

# Defense in depth behind nftables: nobody may log in unless connecting from the bastion.
Match Address *,!192.168.1.52/32
	DenyUsers *
