# Generated by infra/gpu/network/generate.py from config.yaml. Do not edit by hand.
# /etc/ssh/sshd_config.d/10-gpu-bastion.conf on the bastion (admin.tether.internal).
# The bastion is a jump host only: administrators reach GPU hosts with ProxyJump (ssh -J), which
# opens a direct-tcpip channel; they get no shell here. The SSH session is end-to-end encrypted
# through the bastion, so sessions are recorded on the GPU host (tlog), not here.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
# Nobody forwards anything by default; only the admin group may open channels to GPU sshd.
AllowTcpForwarding no
PermitOpen none
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
LogLevel VERBOSE
SyslogFacility AUTHPRIV

Match Group sudo
	AllowTcpForwarding local
	PermitOpen gpu-01.gpu.tether.internal:22 192.168.1.27:22
	PermitTTY no
	ForceCommand /usr/sbin/nologin
