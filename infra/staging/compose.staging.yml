# Single-host staging override for infra/docker-compose.yml (used by 30-control-plane.sh).
#   docker compose -f infra/docker-compose.yml -f infra/staging/compose.staging.yml up -d --build
# Differences from local development:
# - Every published port is bound to 127.0.0.1 (Docker bypasses the host firewall, and the Policy API
#   still runs AUTH_MODE=dev, which accepts "dev:<user>" bearer tokens). Postgres is not published.
# - Service tokens come from infra/.env (generated by 30-control-plane.sh), not the dev-* defaults.
# - The interceptor authenticates the gateway (extension JWT) and listens only on a Unix socket in
#   TETHER_RUN_DIR on the host, running as the gateway's uid so the gateway can open it.
# - Sandboxes reach the platform at https://host.openshell.internal (host loopback): tls-front on
#   127.0.0.1:443 routes /v1/ to the Policy API and the rest to the LLM gateway.
# - The LLM gateway reaches Ollama only through inference-proxy (envoy, mTLS + source address), the
#   config rendered from infra/staging/gpu-network.yaml. Certificates: infra/staging/60-tls.sh.
#   Each container mounts only its own key.
# Relative paths resolve against infra/ (the first compose file).
networks:
  default:
    ipam:
      config: [{subnet: 172.30.0.0/24}]   # llm-gateway's fixed address is the inference proxy's allow-list
services:
  postgres:
    ports: !reset []
  policy-api:
    ports: !override ["127.0.0.1:8080:8080"]
    environment:
      PLATFORM_LLM_GATEWAY_HOST: host.openshell.internal
      PLATFORM_POLICY_API_HOST: host.openshell.internal
      PLATFORM_LOCAL_INFERENCE_HOSTS: gpu.tether.internal
    volumes: !override ["./staging/policies:/policies:ro"]
  credential-broker:
    ports: !override ["127.0.0.1:8081:8081"]
  llm-gateway:
    ports: !override ["127.0.0.1:8082:8082"]
    networks:
      default: {ipv4_address: 172.30.0.10}
    extra_hosts: ["gpu-01.gpu.tether.internal:host-gateway"]
    environment:
      LOCAL_UPSTREAM: https://gpu-01.gpu.tether.internal:8443
      LOCAL_CLIENT_CERT: /etc/tether/tls/llm-gateway-client.crt
      LOCAL_CLIENT_KEY: /etc/tether/tls/llm-gateway-client.key
      LOCAL_CA_BUNDLE: /etc/tether/tls/service-ca.pem
      LOCAL_ALLOW_PLAINTEXT: ""
    volumes:
      - ${TETHER_TLS_DIR:?}/llm-gateway-client.crt:/etc/tether/tls/llm-gateway-client.crt:ro
      - ${TETHER_TLS_DIR:?}/llm-gateway-client.key:/etc/tether/tls/llm-gateway-client.key:ro
      - ${TETHER_TLS_DIR:?}/service-ca.pem:/etc/tether/tls/service-ca.pem:ro
  sandbox-orchestrator:
    ports: !override ["127.0.0.1:8083:8083"]
    environment:
      LLM_GATEWAY_URL: https://host.openshell.internal
      POLICY_API_PUBLIC_URL: https://host.openshell.internal
  gateway-interceptor:
    user: "${TETHER_UID:?}:${TETHER_GID:?}"
    environment:
      INTERCEPTOR_ALLOW_UNAUTHENTICATED: "0"
      INTERCEPTOR_LISTEN: unix:///run/tether/gateway-interceptor.sock
      GATEWAY_ID: openshell
      GATEWAY_EXTENSION_PUBLIC_KEY_FILE: /jwt/public.pem
      ALLOWED_SANDBOX_IMAGES: ${ALLOWED_SANDBOX_IMAGES:-}
    volumes: !override
      # Company profiles with the platform host rewritten to host.openshell.internal (30-control-plane.sh).
      - ./staging/out/profiles:/profiles:ro
      - ${TETHER_RUN_DIR:?}:/run/tether
      - ${TETHER_JWT_PUBLIC_KEY:?}:/jwt/public.pem:ro
    ports: !reset []
    restart: unless-stopped
  tls-front:
    image: ${ENVOY_IMAGE:?}
    user: "${TETHER_UID:?}:${TETHER_GID:?}"
    command: ["envoy", "-c", "/etc/envoy/front.yaml", "--log-level", "warn"]
    volumes:
      - ./staging/envoy-front.yaml:/etc/envoy/front.yaml:ro
      - ${TETHER_TLS_DIR:?}/front.crt:/etc/tether/tls/front.crt:ro
      - ${TETHER_TLS_DIR:?}/front.key:/etc/tether/tls/front.key:ro
    ports: ["127.0.0.1:443:8443"]
    depends_on: [policy-api, llm-gateway]
    restart: unless-stopped
  inference-proxy:
    image: ${ENVOY_IMAGE:?}
    user: "${TETHER_UID:?}:${TETHER_GID:?}"
    # Host network: the engine listens on host loopback. The listener accepts only llm-gateway's
    # source address and client certificate (generated RBAC + mTLS).
    network_mode: host
    command: ["envoy", "-c", "/etc/envoy/inference.yaml", "--log-level", "warn"]
    volumes:
      - ./staging/out/gpu-network/envoy/envoy.yaml:/etc/envoy/inference.yaml:ro
      - ${TETHER_TLS_DIR:?}/inference.crt:/etc/tether/tls/inference.crt:ro
      - ${TETHER_TLS_DIR:?}/inference.key:/etc/tether/tls/inference.key:ro
      - ${TETHER_TLS_DIR:?}/service-ca.pem:/etc/tether/tls/service-ca.pem:ro
    restart: unless-stopped
