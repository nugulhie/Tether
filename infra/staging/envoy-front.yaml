# TLS front for the single-host deployment (compose.staging.yml service `tls-front`, published on 127.0.0.1:443).
# Sandboxes reach it as https://host.openshell.internal (OpenShell maps that name to host loopback), so the
# policy compiler's LLM gateway and Policy API rules, both host.openshell.internal:443, land here:
#   /v1/...   -> Policy API  (permission checks from the sandbox)
#   other     -> LLM gateway (/anthropic, /openai, /local)
# Certificate: front.crt from infra/staging/60-tls.sh (SAN host.openshell.internal, 127.0.0.1, server IP).
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
static_resources:
  listeners:
  - name: front
    address: {socket_address: {address: 0.0.0.0, port_value: 8443}}
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_params: {tls_minimum_protocol_version: TLSv1_2}
            alpn_protocols: [http/1.1]
            tls_certificates:
            - certificate_chain: {filename: /etc/tether/tls/front.crt}
              private_key: {filename: /etc/tether/tls/front.key}
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: front
          codec_type: HTTP1
          use_remote_address: true
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          stream_idle_timeout: 300s
          common_http_protocol_options: {headers_with_underscores_action: REJECT_REQUEST}
          route_config:
            name: front
            virtual_hosts:
            - name: front
              domains: ['*']
              routes:
              - match: {prefix: /v1/}
                route: {cluster: policy_api, timeout: 30s}
              - match: {prefix: /}
                route: {cluster: llm_gateway, timeout: 600s}
          http_filters:
          - name: envoy.filters.http.router
            typed_config: {'@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
  - name: policy_api
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: policy_api
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: policy-api, port_value: 8080}}}}]}]
  - name: llm_gateway
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: llm_gateway
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: llm-gateway, port_value: 8082}}}}]}]
