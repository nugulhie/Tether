# Install as /etc/systemd/system/gpu-inference.service.d/10-verify-signatures.conf (root:root 0644),
# then `systemctl daemon-reload`. ADR 0001 G-6: the engine starts only after the serving image and the
# model weights verify against company keys. Both checks print one JSON event line (image.verify,
# model.verify) to the journal for log shipping.
#
# Fail closed:
#  - No "-" prefix on ExecStartPre / EnvironmentFile: any failure stops the unit from starting.
#  - The engine's ExecStart must run exactly ${SERVING_IMAGE} (a digest) and mount ${MODEL_DIR}
#    read-only, so what runs is what was verified. See serving.env.example.
#  - There is no skip switch. The guardrail break-glass does not touch this unit.

[Unit]
# Re-verify on every (re)start; a restart loop on failure is preferable to serving unverified weights.
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
EnvironmentFile=/etc/tether/gpu-serving/serving.env
ExecStartPre=/opt/tether/modelsign/venv/bin/python -I /opt/tether/modelsign/modelsign.py verify-image --image ${SERVING_IMAGE} --keys /etc/tether/signing/image-keys --cosign /usr/local/bin/cosign
ExecStartPre=/opt/tether/modelsign/venv/bin/python -I /opt/tether/modelsign/modelsign.py verify --dir ${MODEL_DIR} --keys /etc/tether/signing/model-keys --expect-model ${MODEL_NAME} --expect-version ${MODEL_VERSION}
# Hashing multi-GB shards takes a while; do not let the default start timeout turn into a retry storm.
TimeoutStartSec=30min
