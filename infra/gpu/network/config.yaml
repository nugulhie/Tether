# Single source of truth for GPU inference network enforcement (ADR 0001 D2; G-1, G-7).
# `python generate.py` renders out/ from this file. Example values: replace them with the real
# addresses before rollout. Every address list is validated (no 0.0.0.0/0, no broad ranges).

inference:
  # Suffix that covers every inference host name. The Policy API refuses sandbox policies that
  # allow it: set PLATFORM_LOCAL_INFERENCE_HOSTS to this value (rendered to out/gateway.env).
  domain: gpu.company.internal
  # What the LLM gateway calls (LOCAL_UPSTREAM). The name must resolve to the host addresses
  # below without source NAT in between (DNS round-robin or a DSR L4 balancer), or the
  # source allow-list sees the balancer instead of the gateway.
  upstream: https://inference.gpu.company.internal:8443
  proxy_port: 8443        # envoy mTLS listener, the only serving port reachable from outside
  engine_port: 8000       # vLLM/TGI, bound to 127.0.0.1 only (never opened in the firewall)
  # OpenAI-compatible paths the proxy forwards; everything else gets 404 at the proxy.
  allowed_paths: [/v1/chat/completions, /v1/completions, /v1/embeddings, /v1/models]
  hosts:
    - name: gpu-01
      fqdn: gpu-01.gpu.company.internal
      address: 10.40.0.11
    - name: gpu-02
      fqdn: gpu-02.gpu.company.internal
      address: 10.40.0.12

gateway:
  # llm-gateway egress addresses (fixed). Narrower than /28 is required.
  source_cidrs: [10.20.0.10/32, 10.20.0.11/32]
  # The gateway's client certificate (LOCAL_CLIENT_CERT). The proxy accepts only a certificate
  # issued by client_ca that carries exactly this DNS SAN.
  client_san_dns: llm-gateway.company.internal

tls:
  # Paths on the GPU host / in the pod.
  server_cert: /etc/gpu-inference/tls/server.crt   # SAN must include the upstream host name
  server_key: /etc/gpu-inference/tls/server.key
  client_ca: /etc/gpu-inference/tls/gateway-client-ca.pem   # issues only gateway client certs

monitoring:
  # Metrics scrapers (D2: management ports only to the monitoring network). Empty: no metrics port.
  source_cidrs: [10.30.0.5/32]
  metrics_port: 9443      # proxy listener serving GET /metrics only

ssh:
  port: 22
  bastion_host: bastion.company.internal
  bastion_cidrs: [10.10.0.5/32]
  admin_group: gpu-admins

# Allowed outbound traffic from GPU hosts. Everything else is dropped and logged.
# applies_to: host (nftables on bare metal) and/or pod (Kubernetes serving pod). Pods get
# cluster DNS automatically and need nothing else by default; image pulls are done by the node.
egress:
  - name: dns
    cidrs: [10.0.0.53/32, 10.0.1.53/32]
    proto: [udp, tcp]
    ports: [53]
  - name: ntp
    cidrs: [10.0.0.123/32]
    proto: [udp]
    ports: [123]
  - name: package-mirror
    cidrs: [10.50.0.10/32]
    proto: [tcp]
    ports: [443]
  - name: registry
    cidrs: [10.50.0.20/32]
    proto: [tcp]
    ports: [443]
  - name: log-shipping
    cidrs: [10.60.0.20/32]
    proto: [tcp]
    ports: [6514]

kubernetes:
  namespace: gpu-inference
  pod_labels: {app.kubernetes.io/name: llm-inference}
  # Cluster DNS pods the serving pod may query.
  dns_namespace: kube-system
  dns_pod_labels: {k8s-app: kube-dns}
