# OpenShell gateway configuration fragment: company governance interceptor.
# binding_policy = "exact" makes the gateway refuse to start unless these bindings match the
# interceptor's manifest exactly. Keep in sync with services/gateway-interceptor/interceptor/rules.py
# (a test enforces it). Teardown RPCs (Delete*, Detach*, Revoke*) are deliberately unbound.

[openshell.gateway]
# Only company profiles exist: the stock profiles (e.g. `github`, whose broad rules would undo
# org scoping) cannot be selected by anyone.
provider_profile_sources = [
  { type = "interceptor", name = "company-agent-governance" },
]

[[openshell.gateway.interceptors]]
name               = "company-agent-governance"
grpc_endpoint      = "https://gateway-interceptor.company.internal:18081"   # REPLACE
tls_ca_cert_path   = "/etc/openshell/interceptor-ca.pem"                   # REPLACE
audience           = "urn:openshell:extension:interceptor:company-agent-governance"
order              = 10
failure_policy     = "fail_closed"
binding_policy     = "exact"
timeout            = "500ms"
max_response_bytes = 1048576
max_patches        = 32

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/CreateSandbox"
phases = ["modify_operation", "validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/UpdateConfig"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/AttachSandboxProvider"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/CreateProvider"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/UpdateProvider"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/ImportProviderProfiles"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/UpdateProviderProfiles"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/DeleteProviderProfile"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/ConfigureProviderRefresh"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/RotateProviderCredential"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/SubmitPolicyAnalysis"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/ApproveDraftChunk"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/ApproveAllDraftChunks"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/EditDraftChunk"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/UndoDraftChunk"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/CreateSshSession"
phases = ["validate"]

[[openshell.gateway.interceptors.bindings]]
rpc    = "openshell.v1.OpenShell/ExposeService"
phases = ["validate"]
